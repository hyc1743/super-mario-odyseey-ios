# 在 GitHub 云端出包：不需要 Mac，不需要 Xcode。
#
# 两个 job：
#   selftest   Linux：跑 smo/tools/selftest.py（不需要任何游戏文件），保证工具链没被改坏
#   shell-ipa  macOS：用 runner 自带的 Xcode 构建 App 壳，产出**未签名 IPA** 作为 artifact；
#              打 tag 时自动挂到 Release 上
#
# 为什么 macOS runner 就够：参考项目是在 Apple 芯片的 Mac 上用 xcodebuild 出包的，
# GitLab/GitHub 的 macOS runner 正好提供这台机器（含 Xcode 与 Metal 工具链），
# 于是「没有 Mac」不再是障碍。
#
# 拿到 IPA 之后：用 Sideloadly / AltStore 之类工具，用你自己的 Apple ID 签名再装到 iPhone。
# 免费 Apple ID 也能签（签名 7 天过期，到期重签重装；最多 3 台设备、每台 3 个 App）。
name: build shell ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write          # 打 tag 时创建 Release 需要

jobs:
  selftest:
    name: 工具链自检（不需要游戏文件）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 装依赖
        run: pip install -r requirements.txt
      - name: 自检（Yaz0 / SARC / NSO 头 / 改写器端到端）
        run: python3 smo/tools/selftest.py
      - name: 造合成改写产物（装载器自检用；真产物是游戏内容，不能进 CI）
        run: python3 smo/tools/make_synthetic_artifacts.py work/synthetic
      - name: 编宿主里平台无关的那部分（含自动生成的接管表）
        run: |
          gcc -O2 -Wall -Wextra -Werror -c -o /tmp/hle.o smo/host/hle.c -Ismo/host
          gcc -O2 -Wall -Wextra -Werror -c -o /tmp/hf.o smo/host/hle_force_gen.c -Ismo/host
      - name: 编译并跑装载器自检
        run: |
          gcc -O2 -Wall -Wextra -Werror -o /tmp/loader_selftest               smo/host/loader_core.c smo/host/tests/loader_selftest.c
          /tmp/loader_selftest work/synthetic sdk main 2>&1 | tee -a /tmp/selftests.log
      - name: 内核内存族单测（不需要游戏文件）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -o /tmp/svc_selftest               smo/host/hle_svc.c smo/host/tests/svc_selftest.c
          /tmp/svc_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: 内核线程族单测（真并发，不需要游戏文件）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -o /tmp/thread_selftest               smo/host/hle_thread.c smo/host/tests/thread_selftest.c
          /tmp/thread_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: fs 服务单测（自己造 romfs 与存档，不需要游戏文件）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -o /tmp/fs_selftest               smo/host/hle_fs.c smo/host/hle.c smo/host/hle_force_gen.c smo/host/tests/fs_selftest.c 2>&1 | tee -a /tmp/selftests.log
          /tmp/fs_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: oe + hid 服务单测（环境查询与输入布局）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -o /tmp/oehid_selftest               smo/host/hle_oe.c smo/host/hle_hid.c smo/host/hle.c smo/host/hle_force_gen.c               smo/host/tests/oehid_selftest.c
          /tmp/oehid_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: NVN 接口层单测（按名取函数与命令记录，不需要游戏文件）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -Ismo/gfx/nvn -o /tmp/nvn_selftest smo/gfx/nvn/hle_nvn.c smo/gfx/nvn/nvn_table.c smo/gfx/nvn/nvn_state.c smo/gfx/nvn/nvn_core.c smo/gfx/nvn/tests/nvn_selftest.c 2>&1 | tee -a /tmp/selftests.log
          /tmp/nvn_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: NVN 核心家族状态层单测（设备/池/缓冲/同步/采样器/程序）
        run: |
          gcc -O2 -Wall -Wextra -Werror -Ismo/host -Ismo/gfx/nvn -o /tmp/nvn_core_selftest smo/gfx/nvn/hle_nvn.c smo/gfx/nvn/nvn_table.c smo/gfx/nvn/nvn_state.c smo/gfx/nvn/nvn_core.c smo/gfx/nvn/tests/nvn_core_selftest.c 2>&1 | tee -a /tmp/selftests.log
          /tmp/nvn_core_selftest 2>&1 | tee -a /tmp/selftests.log
      - name: 图形入口必须在接管清单里（否则游戏拿不到任何 NVN 函数）
        run: |
          if ! grep -q 'nvnBootstrapLoader' smo/host/hle_force_gen.c; then
            echo '::error::接管清单里没有 nvnBootstrapLoader'; exit 1;
          fi
          echo '图形入口在接管清单里（抢在 sdk 自己的实现之前）'
      - name: x18 不变量检查（改写产物里不能有指令写通用 x18）
        run: python3 smo/tools/check_x18.py work/synthetic
      - name: 检查生成物与名字表一致（NVN 表与记录桩）
        run: |
          python3 smo/tools/gen_nvn.py --check
          python3 smo/tools/gen_nvn_records.py --check
      - name: 检查自动生成的接管表与 import 清单一致
        run: python3 smo/tools/gen_hle_force.py --check
      - name: 失败时把单测日志发成注解
        # ubuntu job 的输出同样要能被读到（运行日志要管理员权限，注解是公开的）
        if: failure()
        run: |
          for f in /tmp/selftests.log; do
            [ -f "$f" ] || continue
            echo "===== $f 尾部 ====="
            tail -40 "$f"
            tail -25 "$f" | while IFS= read -r l; do echo "::error::[单测] $l"; done
          done

  shell-ipa:
    name: 构建 App 壳 → 未签名 IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 工具版本
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: 编译宿主（macOS：entry.S / thread.c / loader_apple.c / main.c 的真实检查）
        run: |
          set -o pipefail
          make -C smo/host smo_host 2>&1 | tee smo/host/build.log
      - name: 装 xcodegen（生成 .xcodeproj）
        run: brew install xcodegen
      - name: 构建并打包
        env:
          # 分支推送时 github.ref_name 是分支名，tag 时是 tag；不再直接把 git SHA 当版本号塞进
          # MARKETING_VERSION（CFBundleShortVersionString 只允许数字与点，脚本里会归化）
          SMO_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
          SMO_DEBUG: 1            # 构建脚本 set -x：日志里能看出卡在哪一条命令
        # 整段输出同时写文件：GitHub 的运行日志要管理员权限才能下载，
        # 而 check-run 的 annotations 是公开可读的，所以失败时把日志尾部发成注解（见下一步）
        run: |
          set -o pipefail
          bash smo/ios/shell_build.sh 2>&1 | tee smo/ios/out_step.log
      - name: 失败时把报错发成注解
        # 注释：这是维护者/协作方在拿不到仓库管理员权限时，唯一能直接看到真实报错的通道
        if: failure()
        run: |
          for f in smo/host/build.log smo/ios/out_step.log smo/ios/out/xcodebuild.log; do
            [ -f "$f" ] || { echo "::error::缺少 $f"; continue; }
            echo "===== $f 尾部 ====="
            tail -30 "$f"
            echo "===== error 行 ====="
            grep -nE "error:|error |Error:|No such file|command not found|Traceback|✗|✘|Specification|invalid" "$f" | head -12 | while IFS= read -r l; do echo "::error::$l"; done
            tail -12 "$f" | while IFS= read -r l; do echo "::error::[尾] $l"; done
          done
      - name: 失败时把日志传上来
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志
          path: |
            smo/host/build.log
            smo/ios/out_step.log
            smo/ios/out/xcodebuild.log
          if-no-files-found: warn
      - name: 产物摘要
        if: success()
        run: |
          ls -la smo/ios/out
          unzip -l smo/ios/out/SMOMobile-shell.ipa | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: SMOMobile-shell-ipa
          path: smo/ios/out/SMOMobile-shell.ipa
          if-no-files-found: error
      - name: 打 tag 时发 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: smo/ios/out/SMOMobile-shell.ipa
          generate_release_notes: true
          body: |
            App 壳（未签名）。里面**不含任何游戏内容**：不含游戏程序、着色器、美术、音频、文本或数据表。

            用法：
            1. 下载 `SMOMobile-shell.ipa`
            2. 用 Sideloadly / AltStore 等工具，用你自己的 Apple ID 签名后装到 iPhone（免费账号即可，7 天过期）
            3. 安装后打开会看到一个状态页：它会列出移植进度，并检查游戏文件在不在

            ⚠️ 这一版**还不能玩**：宿主（系统服务 HLE）与图形层（NVN→Metal）还没接上。
            进度与依据见仓库的 STATUS.md。
