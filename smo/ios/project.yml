# xcodegen 工程描述 —— 出包链路用它生成 .xcodeproj，再由 xcodebuild 构建。
# 为什么用 xcodegen：参考项目也是这么做的（dm/ios/project.yml），工程文件不进仓、只留可读的描述。
name: SMOMobile

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"          # 保守值：只要 CI runner 的 Xcode 不比这更老就行；以后接图形层需要 iOS 26 再抬
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"        # 只 iPhone（本项目目标设备是 iPhone 17 Pro Max）
    CODE_SIGNING_ALLOWED: "NO"         # 出未签名 IPA，由使用者用自己的 Apple ID 签名
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CLANG_ENABLE_OBJC_ARC: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  SMOMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smomobile
        PRODUCT_NAME: SMOMobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: SMO Mobile
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true                 # 让「文件」App 能把游戏文件拷进 App 目录
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false

schemes:
  SMOMobile:
    build:
      targets:
        SMOMobile: all
    run:
      config: Release
    archive:
      config: Release
