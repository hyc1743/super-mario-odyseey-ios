# xcodegen 工程描述 —— 出包链路用它生成 .xcodeproj，再由 xcodebuild 构建。
# 为什么用 xcodegen：参考项目也是这么做的（dm/ios/project.yml），工程文件不进仓、只留可读的描述。
name: SMOMobile

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"          # 保守值：只要 CI runner 的 Xcode 不比这更老就行；以后接图形层需要 iOS 26 再抬
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"        # 只 iPhone（本项目目标设备是 iPhone 17 Pro Max）
    CODE_SIGNING_ALLOWED: "NO"         # 出未签名 IPA，由使用者用自己的 Apple ID 签名
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CLANG_ENABLE_OBJC_ARC: "YES"
    HEADER_SEARCH_PATHS: "$(SRCROOT)/../host $(SRCROOT)/../gfx/nvn"
    # 文件 App 里能看到 App 自己的目录（我的 iPhone → SMOMobile）—— 不加这两个键就不会出现
    INFOPLIST_KEY_UIFileSharingEnabled: "YES"
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  SMOMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: [SharedFonts]
      - path: Resources/SharedFonts
        type: folder
      # 宿主（同一份代码编进 App；不包含 host/main.c —— App 的引导在 main.m 的 RunHost 里）
      - path: ../host/loader_core.c
      - path: ../host/host_boot.c
      - path: ../host/loader_apple.c
      - path: ../host/thread.c
      - path: ../host/hle.c
      - path: ../host/hle_svc.c
      - path: ../host/hle_thread.c
      - path: ../host/hle_fs.c
      - path: ../host/hle_hipc.c
      - path: ../host/hle_sdkinit.c
      - path: ../host/hle_vi.c
      - path: ../host/hle_oe.c
      - path: ../host/hle_pl.c
      - path: ../host/hle_audio.c
      - path: ../host/hle_hid.c
      - path: ../host/hle_force_gen.c
      - path: ../host/hle_nvn_reg.c
      - path: ../host/logbuf.c
      - path: ../host/romfs_resolve.c
      - path: ../host/smoarc.c
      - path: ../host/entry.S
      # 图形层（宿主同一份；nvn_mtl.m 暂不进 App —— 图形层接上时再加）
      - path: ../gfx/nvn/hle_nvn.c
      - path: ../gfx/nvn/nvn_table.c
      - path: ../gfx/nvn/nvn_state.c
      - path: ../gfx/nvn/nvn_core.c
      - path: ../gfx/nvn/nvn_shader.c
      - path: ../gfx/nvn/nvn_replay.c
      - path: ../gfx/nvn/nvn_tex.c
      - path: ../gfx/nvn/nvn_bcdec.c
      - path: ../gfx/nvn/nvn_texread.c
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smomobile
        PRODUCT_NAME: SMOMobile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: SMO Mobile
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true                 # 让「文件」App 能把游戏文件拷进 App 目录
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false

schemes:
  SMOMobile:
    build:
      targets:
        SMOMobile: all
    run:
      config: Release
    archive:
      config: Release
